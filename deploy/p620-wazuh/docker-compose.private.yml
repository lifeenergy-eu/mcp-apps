# Operational overlay for Wazuh v4.14.9 on P620 WSL.
# Restrict host exposure; Wazuh agents will receive private Tailnet forwarding later.
services:
  wazuh.manager:
    ports: !override
      - "127.0.0.1:1514:1514/tcp"
      - "127.0.0.1:1515:1515/tcp"
      - "127.0.0.1:55000:55000/tcp"
  wazuh.indexer:
    ports: !override []
  wazuh.dashboard:
    ports: !override
      - "127.0.0.1:8443:5601/tcp"
